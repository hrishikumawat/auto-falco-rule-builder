- macro: afb_spawned_process
  condition: evt.type in (execve, execveat) and evt.dir = < and evt.rawres >= 0
- rule: AFB Nsenter Execution
  desc: 'Generated by auto-falco-rule-builder: detect nsenter execution in namespace
    prod'
  condition: afb_spawned_process and proc.name = "nsenter" and k8s.ns.name in ("prod")
  output: AFB Nsenter Execution (evt.type=%evt.type proc.name=%proc.name k8s.ns.name=%k8s.ns.name
    proc.cmdline=%proc.cmdline user.name=%user.name k8s.pod.name=%k8s.pod.name container.image.repository=%container.image.repository)
  priority: WARNING
  tags:
  - afb
  - process
  - auto-generated
