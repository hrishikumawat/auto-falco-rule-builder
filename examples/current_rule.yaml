# Example existing detection rule for the TUNE workflow. Analyst-flagged FPs
# come from the monitoring-agent container (see examples/classified_alerts.jsonl).
- rule: AFB Nsenter Execution
  desc: "Generated by auto-falco-rule-builder: detect nsenter execution in namespace prod"
  condition: spawned_process and proc.name = "nsenter" and k8s.ns.name in ("prod")
  output: "AFB Nsenter Execution (proc.name=%proc.name k8s.ns.name=%k8s.ns.name)"
  priority: WARNING
  tags: [afb, process]
