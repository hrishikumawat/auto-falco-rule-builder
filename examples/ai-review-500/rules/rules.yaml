# SYNTHETIC LAB: all ten rules are intentionally noisy.
- macro: noise_lab_successful_exec
  condition: evt.type in (execve, execveat) and evt.rawres >= 0
- rule: Noise Lab 01 Health Check
  desc: Synthetic broad curl execution alert for noise-tuning practice
  condition: noise_lab_successful_exec and proc.name = "curl"
  output: Synthetic execution (command=%proc.cmdline parent=%proc.pname user=%user.name)
  priority: WARNING
  tags:
  - synthetic
  - noise-lab
  - process
