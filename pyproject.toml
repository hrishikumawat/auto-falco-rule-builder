[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-falco-rule-builder"
version = "0.1.0"
description = "Deterministic Falco rule builder: evidence -> spec -> validated candidate -> review package"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
afb = "afb.cli:main"

[tool.setuptools]
packages = ["afb", "afb.adapters"]
